name: Sparkfare Sunday Newsletter Generator

on:
  schedule:
    - cron: '0 14 * * 0'  # 14:00 UTC (10:00 AM EST) every Sunday
  workflow_dispatch: {}

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run Newsletter Generator (Phase 19)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KPI_DASHBOARD_SECRET: ${{ secrets.KPI_DASHBOARD_SECRET }}
        run: python "Phase 19 Newsletter Generator.py"
