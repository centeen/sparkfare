name: Rank curated (shadow)

# N10 (Addendum N, ROADMAP step 157). Ranks the three feeds against the curated store `fare_daily` (scripts/data/rank-curated.mjs), uploads the
# shadow serving files to the private bucket under serving-shadow/, writes route_verdict rows to D1, and commits a counts-only diff against the
# files the site serves today to docs/data/shadow_diffs/. Nothing a visitor sees reads any of it (ENABLE_CURATED_SERVING stays "false").
# Runs after the daily curated refresh, plus once a day as a fallback. A manual run is a dry run unless dry_run is set to false.

on:
  workflow_run:
    workflows: ['Curate fares (daily refresh)']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '53 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = compute and report only: no upload, no D1 write, no commit'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

concurrency:
  group: rank-shadow
  cancel-in-progress: false

jobs:
  shadow:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # commits the diff summary under docs/data/shadow_diffs/

    steps:
      - name: Checkout the latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Install wrangler
        run: npm install --prefix "$RUNNER_TEMP/wr" wrangler@4.129.0 --no-audit --no-fund --loglevel=error

      - name: Rank against the curated store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}
        shell: bash
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--dry-run --out-dir shadow_out"; fi
          node scripts/data/rank-curated.mjs $flags | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show the diff in the run summary (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}
        shell: bash
        run: cat shadow_out/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the diff summary
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false' }}
        shell: bash
        run: |
          git config user.name "sparkfare-bot"
          git config user.email "actions@github.com"
          git add docs/data/shadow_diffs/
          git diff --cached --quiet || git commit -m "Shadow diff - $(date -u +'%Y-%m-%d')"

          # Retry with rebase if another commit lands on main while this job is running.
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "git push failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Push rejected, pulling --rebase and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done
