name: Curate fares (backfill)

# N9 (Addendum N, ROADMAP step 156). Manual only. Builds the curated store `fare_daily` in production D1 from the private raw archive
# (the hourly snapshots and the old git versions of the three history files, read from the sparkfare-raw bucket and checked against
# the repo's copies). One row per route and day, the cheapest fare seen that day, one key format for every origin.
# Safe to run again: the SQL can only lower a stored price and raise n_obs, so a second run changes nothing.
# Dry run is the default: it reads the raw archive, builds the SQL and reports counts, and writes nothing to D1.
# Migration 0036 must be applied to production first (wrangler d1 execute sparkfare-db --remote --file=migrations/0036_curated_store.sql).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build and count only, write nothing to D1'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

concurrency:
  group: curate-fares
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repo (full history: the old versions of the history files)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wrangler
        run: npm install --prefix "$RUNNER_TEMP/wr" wrangler@4.129.0 --no-audit --no-fund --loglevel=error

      - name: Curate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: |
          flags="--source r2"
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi
          node scripts/data/curate-backfill.mjs $flags | tee -a "$GITHUB_STEP_SUMMARY"
