name: Sparkfare Daily Flight Data Pipeline

on:
  schedule:
    # Moved off '0 6 * * *' on 2026-10-07. GitHub delays and drops top-of-the-hour crons under load, and
    # 06:00 UTC is a popular slot: the last 12 scheduled runs all started between 10:46 and 13:32 UTC,
    # 5 to 7.5 hours late (the same problem the hourly workflow had, fixed there by using an off-peak
    # minute). 03:17 UTC leaves room before the 08:00 UTC digest. The daily compile no longer has a morning
    # slot of its own: it chains off this workflow finishing (daily-compile-other-origins.yml). A single slot, not
    # two: the social post used to be the last step here and a second run would have posted twice. The post
    # now lives in daily-social-post.yml so it keeps a sensible posting hour.
    - cron: '17 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab for testing

jobs:
  fetch-and-rank:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated JSON files back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests jsonschema

      - name: Run flight fetch script (Step 8)
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SPARKFARE_RUN_STATS_PATH: fetch_run_stats.json
        run: python "Phase 1 Flight Fetch Script (Step 8).py"

      # N1 (Addendum N): keep the raw fetch output in the private R2 bucket before anything is ranked or trimmed.
      # continue-on-error so a bucket problem can never stop today's data from being committed; the job is failed
      # loudly by the step after the commit instead (GitHub then emails the owner).
      - name: Archive raw fetch output (R2)
        id: raw_upload
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: |
          npm install --prefix "$RUNNER_TEMP/wr" wrangler@4.129.0 --no-audit --no-fund --loglevel=error
          node scripts/data/upload-raw.mjs --pipeline daily_jfk --file sparkfare_flight_prices.json

      # N2 (Addendum N): the priced-route counts of the last OK runs, for the completeness check. Fail-open: with no
      # baseline the check is skipped, never blocking.
      - name: Load the completeness baseline (R2)
        id: baseline
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: node scripts/data/publish-result.mjs get-baseline --pipeline daily_jfk --out baseline.json

      - name: Run deal ranking script (Step 9)
        run: python "Phase 1 Deal Ranking Script (Step 9 - with fallback).py"

      # N2 (Addendum N): fail closed. A blocked run keeps yesterday's files and commits nothing; the job then fails
      # (GitHub emails the owner). continue-on-error only so the result below can still be recorded and the files restored.
      - name: Validate the run (fail closed)
        id: validate
        continue-on-error: true
        run: >
          python scripts/data/validate_feed.py --pipeline daily_jfk --ranked sparkfare_ranked_deals.json
          --store sparkfare_flight_prices.json --stats fetch_run_stats.json --baseline baseline.json
          --out validation_result.json --quarantine-out quarantine.json --write-clean

      - name: Record the validation result (R2)
        id: result_pub
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: node scripts/data/publish-result.mjs publish --pipeline daily_jfk --store sparkfare_flight_prices.json --result validation_result.json --quarantine quarantine.json --stats fetch_run_stats.json

      - name: Restore the last good files if the run was blocked
        if: ${{ steps.validate.outcome == 'failure' }}
        run: git checkout -- sparkfare_flight_prices.json sparkfare_price_history.json sparkfare_ranked_deals.json

      - name: Commit updated data files
        if: ${{ steps.validate.outcome != 'failure' }}
        run: |
          git config user.name "sparkfare-bot"
          git config user.email "actions@github.com"
          git add sparkfare_flight_prices.json sparkfare_price_history.json sparkfare_ranked_deals.json
          git diff --cached --quiet || git commit -m "Daily flight data update - $(date -u +'%Y-%m-%d')"


          # Retry with rebase if a manual commit lands on main while this job is running,
          # rather than failing outright on a non-fast-forward push.
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "git push failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Push rejected, pulling --rebase and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done

      # N14 (Addendum N): publish the validated, committed file to R2 as well. Both paths are live; git stays the source until the flip.
      # continue-on-error so a bucket problem never undoes the commit above; the job is failed loudly by the step below instead.
      - name: Publish serving files (R2)
        id: serving_pub
        if: ${{ steps.validate.outcome != 'failure' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: |
          npm install --prefix "$RUNNER_TEMP/wr" wrangler@4.129.0 --no-audit --no-fund --loglevel=error
          node scripts/data/publish-serving.mjs publish --files sparkfare_ranked_deals.json

      - name: Fail the job if the raw archive upload or the validation gate failed
        if: ${{ steps.raw_upload.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.result_pub.outcome == 'failure' || steps.serving_pub.outcome == 'failure' }}
        run: |
          if [ "${{ steps.validate.outcome }}" = "failure" ]; then
            echo "::error::The validation gate BLOCKED this run (see the 'Validate the run' step). Yesterday's data files were kept; nothing was committed."
          fi
          if [ "${{ steps.raw_upload.outcome }}" = "failure" ]; then
            echo "::error::The raw archive upload to R2 failed (see the 'Archive raw fetch output (R2)' step)."
          fi
          if [ "${{ steps.result_pub.outcome }}" = "failure" ]; then
            echo "::error::Recording the validation result in R2 failed (see the 'Record the validation result (R2)' step)."
          fi
          if [ "${{ steps.serving_pub.outcome }}" = "failure" ]; then
            echo "::error::Publishing the served files to R2 failed (see the 'Publish serving files (R2)' step). The git commit went through; the site is unaffected."
          fi
          exit 1
