name: Sparkfare Hourly Multi-Origin Feed

on:
  workflow_dispatch:
    inputs:
      origins:
        description: "Comma-separated IATA origins to probe"
        required: true
        default: "JFK,LAX"
      confirm_rate_limit:
        description: "Type CONFIRMED only after Travelpayouts rate-limit approval"
        required: true
        default: ""
  schedule:
    # Travelpayouts confirmed 2026-09-06: 300 req/min per token (that confirmation was for the original
    # 12-origin load). Today's run is 23 origins x 40 destinations = 920 requests, spread by the fetch
    # script's own 2s per-request delay to ~30 req/min -- still well under the limit. At that delay a run
    # takes about 31 minutes of fetching (about 34 with ranking and the commit); it was 22-25 minutes at
    # 16 origins (Actions history, 2026-10-10). Updated 2026-10-10 when PHL, MSP, CLT, DTW, FLL, BWI and AUS were added.
    # timeout-minutes below (60) leaves about 25 minutes of headroom; raise it before adding more origins.
    # Deliberately NOT ':00' -- GitHub's own docs warn top-of-hour crons hit platform-wide
    # congestion. Confirmed in practice 2026-09-11: with '0 * * * *' every run that fired
    # succeeded, but actual cadence was ~every 3-5 hours instead of hourly (GitHub silently
    # delays/drops congested slots). Using :23 to land off-peak.
    - cron: '23 * * * *'

jobs:
  fetch-and-rank-hourly:
    # Scheduled runs are pre-approved now that the rate limit is confirmed (no `inputs` context
    # exists on a schedule trigger, so this can't check confirm_rate_limit for those runs anyway).
    # Manual (workflow_dispatch) runs still require explicitly typing CONFIRMED, since those can
    # target an arbitrary, larger origins list.
    if: ${{ github.event_name == 'schedule' || inputs.confirm_rate_limit == 'CONFIRMED' }}
    runs-on: ubuntu-latest
    # A run must never overlap the next one (they commit to the same data files), and a hung run must not
    # hold the slot for GitHub's 6-hour default. Runs queue rather than cancel, so no fetch is lost.
    concurrency:
      group: hourly-multi-origin-fetch
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests jsonschema

      - name: Fetch multi-origin prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # TLV (Tel Aviv) is a deliberate extra origin for design-partner testing, not a real
          # US-market decision -- see CLAUDE.md's "Decisions locked" section. 23 origins x 40
          # destinations = 920 req/hour, still well under the confirmed 300 req/min limit.
          SPARKFARE_ORIGINS: ${{ github.event_name == 'schedule' && 'JFK,LAX,ORD,ATL,DFW,SFO,MIA,IAD,EWR,SEA,IAH,BOS,DEN,PHX,LAS,PHL,MSP,CLT,DTW,FLL,BWI,AUS,TLV' || inputs.origins }}
          SPARKFARE_FLIGHT_PRICES_PATH: sparkfare_hourly_flight_prices.json
          SPARKFARE_SNAPSHOT_DIR: sparkfare_hourly_snapshots
          SPARKFARE_RUN_STATS_PATH: fetch_run_stats.json
        run: python "Phase 1 Flight Fetch Script (Step 8).py"

      # N1 (Addendum N): keep the raw fetch output in the private R2 bucket before anything is ranked or trimmed.
      # continue-on-error so a bucket problem can never stop today's data from being committed; the job is failed
      # loudly by the step after the commit instead (GitHub then emails the owner).
      - name: Archive raw fetch output (R2)
        id: raw_upload
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: |
          npm install --prefix "$RUNNER_TEMP/wr" wrangler@4.129.0 --no-audit --no-fund --loglevel=error
          node scripts/data/upload-raw.mjs --pipeline multi_origin --file sparkfare_hourly_flight_prices.json

      # N2 (Addendum N): the priced-route counts of the last OK runs, for the completeness check. Fail-open: with no
      # baseline the check is skipped, never blocking.
      - name: Load the completeness baseline (R2)
        id: baseline
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: node scripts/data/publish-result.mjs get-baseline --pipeline multi_origin --out baseline.json

      - name: Rank multi-origin prices
        env:
          SPARKFARE_FLIGHT_PRICES_PATH: sparkfare_hourly_flight_prices.json
          SPARKFARE_PRICE_HISTORY_PATH: sparkfare_hourly_price_history.json
          SPARKFARE_RANKED_DEALS_PATH: sparkfare_hourly_ranked_deals.json
        run: python "Phase 1 Deal Ranking Script (Step 9 - with fallback).py"

      # ROADMAP step 58, same-speed free tier. Runs ONLY when the repository variable SPARKFARE_FREE_TIER_DELAY_HOURS is
      # exactly "0" (unset or anything else leaves this skipped and the daily compile in charge, 24-hour delay). No extra
      # Travelpayouts calls: it reads the snapshot this run just wrote. "ALL" minus JFK means every non-JFK origin in the
      # fetch above, so the origin list is not copied a third time. The ranking script keeps the day's cheapest price and
      # excludes today from the baseline, so running it every hour does not duplicate or skew history.
      - name: Compile same-speed free-tier view (non-JFK origins)
        if: ${{ vars.SPARKFARE_FREE_TIER_DELAY_HOURS == '0' }}
        env:
          SPARKFARE_FREE_ORIGINS: ALL
          SPARKFARE_FREE_ORIGINS_EXCLUDE: JFK
          SPARKFARE_SNAPSHOT_DIR: sparkfare_hourly_snapshots
          SPARKFARE_FREE_TIER_FEED_PATH: sparkfare_flight_prices_other_origins.json
          SPARKFARE_FREE_TIER_DELAY_HOURS: "0"
        run: python "Phase 11 Compile Free Tier View.py"

      - name: Rank same-speed free-tier view
        if: ${{ vars.SPARKFARE_FREE_TIER_DELAY_HOURS == '0' }}
        env:
          SPARKFARE_FLIGHT_PRICES_PATH: sparkfare_flight_prices_other_origins.json
          SPARKFARE_PRICE_HISTORY_PATH: sparkfare_price_history_other_origins.json
          SPARKFARE_RANKED_DEALS_PATH: sparkfare_ranked_deals_other_origins.json
        run: python "Phase 1 Deal Ranking Script (Step 9 - with fallback).py"

      # N2 (Addendum N): fail closed, as in daily-fetch. The free-tier view (when switched on) is checked too.
      - name: Validate the run (fail closed)
        id: validate
        continue-on-error: true
        run: >
          python scripts/data/validate_feed.py --pipeline multi_origin --ranked sparkfare_hourly_ranked_deals.json
          --store sparkfare_hourly_flight_prices.json --stats fetch_run_stats.json --baseline baseline.json
          --out validation_result.json --quarantine-out quarantine.json --write-clean

      - name: Validate the same-speed free-tier view
        id: validate_free
        if: ${{ vars.SPARKFARE_FREE_TIER_DELAY_HOURS == '0' }}
        continue-on-error: true
        run: >
          python scripts/data/validate_feed.py --pipeline multi_origin --ranked sparkfare_ranked_deals_other_origins.json
          --out validation_free_result.json --write-clean

      - name: Record the validation result (R2)
        id: result_pub
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
        run: node scripts/data/publish-result.mjs publish --pipeline multi_origin --store sparkfare_hourly_flight_prices.json --result validation_result.json --quarantine quarantine.json --stats fetch_run_stats.json

      - name: Restore the last good files if the run was blocked
        if: ${{ steps.validate.outcome == 'failure' || steps.validate_free.outcome == 'failure' }}
        run: git checkout -- sparkfare_hourly_flight_prices.json sparkfare_hourly_price_history.json sparkfare_hourly_ranked_deals.json sparkfare_flight_prices_other_origins.json sparkfare_price_history_other_origins.json sparkfare_ranked_deals_other_origins.json

      - name: Commit hourly data
        if: ${{ steps.validate.outcome != 'failure' && steps.validate_free.outcome != 'failure' }}
        run: |
          git config user.name "sparkfare-bot"
          git config user.email "actions@github.com"
          git add sparkfare_hourly_flight_prices.json sparkfare_hourly_price_history.json sparkfare_hourly_ranked_deals.json sparkfare_hourly_snapshots/
          # Same-speed free tier files; unchanged (so nothing staged) unless the variable is "0".
          git add sparkfare_flight_prices_other_origins.json sparkfare_price_history_other_origins.json sparkfare_ranked_deals_other_origins.json
          git diff --cached --quiet || git commit -m "Hourly multi-origin flight data update"

          # A manual commit landing on main mid-run (this job takes 15-20 min) makes a plain
          # `git push` fail as non-fast-forward -- confirmed as the cause of the 2026-09-11
          # failures. Retry with rebase instead of failing outright.
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "git push failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Push rejected, pulling --rebase and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done

      - name: Fail the job if the raw archive upload or the validation gate failed
        if: ${{ steps.raw_upload.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.validate_free.outcome == 'failure' || steps.result_pub.outcome == 'failure' }}
        run: |
          if [ "${{ steps.validate.outcome }}" = "failure" ]; then
            echo "::error::The validation gate BLOCKED this run (see the 'Validate the run' step). Yesterday's data files were kept; nothing was committed."
          fi
          if [ "${{ steps.raw_upload.outcome }}" = "failure" ]; then
            echo "::error::The raw archive upload to R2 failed (see the 'Archive raw fetch output (R2)' step)."
          fi
          if [ "${{ steps.result_pub.outcome }}" = "failure" ]; then
            echo "::error::Recording the validation result in R2 failed (see the 'Record the validation result (R2)' step)."
          fi
          exit 1
