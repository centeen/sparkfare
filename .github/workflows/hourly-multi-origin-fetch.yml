name: Sparkfare Hourly Multi-Origin Feed

on:
  workflow_dispatch:
    inputs:
      origins:
        description: "Comma-separated IATA origins to probe"
        required: true
        default: "JFK,LAX"
      confirm_rate_limit:
        description: "Type CONFIRMED only after Travelpayouts rate-limit approval"
        required: true
        default: ""
  schedule:
    # Travelpayouts confirmed 2026-09-06: 300 req/min per token (that confirmation was for the original
    # 12-origin load). Today's run is 23 origins x 40 destinations = 920 requests, spread by the fetch
    # script's own 2s per-request delay to ~30 req/min -- still well under the limit. At that delay a run
    # takes about 31 minutes of fetching (about 34 with ranking and the commit); it was 22-25 minutes at
    # 16 origins (Actions history, 2026-10-10). Updated 2026-10-10 when PHL, MSP, CLT, DTW, FLL, BWI and AUS were added.
    # timeout-minutes below (60) leaves about 25 minutes of headroom; raise it before adding more origins.
    # Deliberately NOT ':00' -- GitHub's own docs warn top-of-hour crons hit platform-wide
    # congestion. Confirmed in practice 2026-09-11: with '0 * * * *' every run that fired
    # succeeded, but actual cadence was ~every 3-5 hours instead of hourly (GitHub silently
    # delays/drops congested slots). Using :23 to land off-peak.
    - cron: '23 * * * *'

jobs:
  fetch-and-rank-hourly:
    # Scheduled runs are pre-approved now that the rate limit is confirmed (no `inputs` context
    # exists on a schedule trigger, so this can't check confirm_rate_limit for those runs anyway).
    # Manual (workflow_dispatch) runs still require explicitly typing CONFIRMED, since those can
    # target an arbitrary, larger origins list.
    if: ${{ github.event_name == 'schedule' || inputs.confirm_rate_limit == 'CONFIRMED' }}
    runs-on: ubuntu-latest
    # A run must never overlap the next one (they commit to the same data files), and a hung run must not
    # hold the slot for GitHub's 6-hour default. Runs queue rather than cancel, so no fetch is lost.
    concurrency:
      group: hourly-multi-origin-fetch
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch multi-origin prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # TLV (Tel Aviv) is a deliberate extra origin for design-partner testing, not a real
          # US-market decision -- see CLAUDE.md's "Decisions locked" section. 23 origins x 40
          # destinations = 920 req/hour, still well under the confirmed 300 req/min limit.
          SPARKFARE_ORIGINS: ${{ github.event_name == 'schedule' && 'JFK,LAX,ORD,ATL,DFW,SFO,MIA,IAD,EWR,SEA,IAH,BOS,DEN,PHX,LAS,PHL,MSP,CLT,DTW,FLL,BWI,AUS,TLV' || inputs.origins }}
          SPARKFARE_FLIGHT_PRICES_PATH: sparkfare_hourly_flight_prices.json
          SPARKFARE_SNAPSHOT_DIR: sparkfare_hourly_snapshots
        run: python "Phase 1 Flight Fetch Script (Step 8).py"

      - name: Rank multi-origin prices
        env:
          SPARKFARE_FLIGHT_PRICES_PATH: sparkfare_hourly_flight_prices.json
          SPARKFARE_PRICE_HISTORY_PATH: sparkfare_hourly_price_history.json
          SPARKFARE_RANKED_DEALS_PATH: sparkfare_hourly_ranked_deals.json
        run: python "Phase 1 Deal Ranking Script (Step 9 - with fallback).py"

      - name: Commit hourly data
        run: |
          git config user.name "sparkfare-bot"
          git config user.email "actions@github.com"
          git add sparkfare_hourly_flight_prices.json sparkfare_hourly_price_history.json sparkfare_hourly_ranked_deals.json sparkfare_hourly_snapshots/
          git diff --cached --quiet || git commit -m "Hourly multi-origin flight data update"

          # A manual commit landing on main mid-run (this job takes 15-20 min) makes a plain
          # `git push` fail as non-fast-forward -- confirmed as the cause of the 2026-09-11
          # failures. Retry with rebase instead of failing outright.
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "git push failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Push rejected, pulling --rebase and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done
