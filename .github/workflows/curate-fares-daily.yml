name: Curate fares (daily refresh)

# N9 (Addendum N, ROADMAP step 156). Keeps the curated store `fare_daily` in production D1 current: the last 3 days of the committed
# fetch outputs and price-history files, upserted by scripts/data/curate-refresh.mjs (cheapest fare per route and day wins).
# Safe to run any number of times: the SQL can only lower a stored price and raise n_obs. Nothing reads fare_daily yet.
# Runs after the daily fetch finishes, plus once a day as a fallback that also picks up the hourly data.
# A manual run is a dry run unless dry_run is set to false. Run "Curate fares (backfill)" once before relying on this.

on:
  workflow_run:
    workflows: ['Sparkfare Daily Flight Data Pipeline']
    types: [completed]
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build and count only, write nothing to D1'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

concurrency:
  group: curate-fares-daily
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wrangler
        run: npm install --prefix "$RUNNER_TEMP/wr" wrangler@4.129.0 --no-audit --no-fund --loglevel=error

      - name: Refresh the curated store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}
        shell: bash
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--dry-run"; fi
          node scripts/data/curate-refresh.mjs $flags | tee -a "$GITHUB_STEP_SUMMARY"
