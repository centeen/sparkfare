name: Sparkfare Daily Free-Tier View (Other Origins)

on:
  # Chained, not clocked. GitHub starts scheduled workflows hours late on this repo (the daily compile
  # has started 6 to 9 hours after its slot, the daily fetch 5 to 7.5 hours after its slot), and the two
  # delays are independent, so a fixed compile time can land BEFORE the fetch it needs: the /data/ pages
  # would then be regenerated from the previous day's JFK file. Running the compile when the daily fetch
  # finishes guarantees the order whatever time GitHub starts either one.
  workflow_run:
    # Must match the `name:` of daily-fetch.yml exactly (tests/workflow_schedules.test.js checks it).
    workflows: ["Sparkfare Daily Flight Data Pipeline"]
    types: [completed]
    branches: [main]
  schedule:
    # Fallback only, for a day on which the daily fetch fails (the chained run is then skipped). The gate job
    # below skips this run if a compile already succeeded in the last 12 hours, so on a normal day it does
    # nothing. Off-peak minute, same reason as the other workflows.
    - cron: '41 11 * * *'
  workflow_dispatch: {}

# One compile at a time: a chained run and a fallback or manual run must not overlap and race on the
# same data files. A run that has to wait is kept, not cancelled.
concurrency:
  group: daily-compile-other-origins
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read   # lets `gh run list` read this repo's workflow runs
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether to compile
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          UPSTREAM: ${{ github.event.workflow_run.conclusion }}
          FALLBACK_WINDOW_HOURS: "12"
        run: |
          run=true
          case "$EVENT" in
            workflow_run)
              if [ "$UPSTREAM" != "success" ]; then
                run=false
                echo "Daily fetch ended '$UPSTREAM'; not compiling from this trigger (the fallback schedule still covers the day)."
              fi
              ;;
            schedule)
              last=$(gh run list --workflow daily-compile-other-origins.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt // empty')
              if [ -n "$last" ]; then
                age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
                if [ "$age" -lt $(( FALLBACK_WINDOW_HOURS * 3600 )) ]; then
                  run=false
                  echo "A compile already succeeded $(( age / 60 )) minutes ago; skipping the fallback run."
                fi
              fi
              ;;
          esac
          echo "Compile this run: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  compile-and-rank-other-origins:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Compile 24h-delayed view for non-JFK origins
        env:
          # TLV included -- see hourly-multi-origin-fetch.yml's comment on why.
          SPARKFARE_FREE_ORIGINS: "LAX,ORD,ATL,DFW,SFO,MIA,IAD,EWR,SEA,IAH,BOS,DEN,PHX,LAS,PHL,MSP,CLT,TLV"
          SPARKFARE_SNAPSHOT_DIR: sparkfare_hourly_snapshots
          SPARKFARE_FREE_TIER_FEED_PATH: sparkfare_flight_prices_other_origins.json
          SPARKFARE_FREE_TIER_DELAY_HOURS: "24"
        run: python "Phase 11 Compile Free Tier View.py"

      - name: Rank other-origins deals
        env:
          SPARKFARE_FLIGHT_PRICES_PATH: sparkfare_flight_prices_other_origins.json
          SPARKFARE_PRICE_HISTORY_PATH: sparkfare_price_history_other_origins.json
          SPARKFARE_RANKED_DEALS_PATH: sparkfare_ranked_deals_other_origins.json
        run: python "Phase 1 Deal Ranking Script (Step 9 - with fallback).py"

      - name: Regenerate pSEO pages (Workplan Step 106)
        # Runs here, not in daily-fetch.yml, because this is the LATER of the two daily pipelines. On the
        # normal path this workflow is triggered by the daily fetch finishing, so JFK's own daily file is
        # fresh as well as this workflow's other-origins file, and every one of the 480 pages reflects the
        # same day's real data on both sides of the origin split.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python "Phase 17 pSEO Generator (Step 106).py"

      - name: Commit other-origins data
        run: |
          git config user.name "sparkfare-bot"
          git config user.email "actions@github.com"
          git add sparkfare_flight_prices_other_origins.json sparkfare_price_history_other_origins.json sparkfare_ranked_deals_other_origins.json data/ sitemap.xml sparkfare_seo_cache.json
          git diff --cached --quiet || git commit -m "Daily free-tier view update (other origins) - $(date -u +'%Y-%m-%d')"

          # Retry with rebase if a manual commit lands on main while this job is running,
          # rather than failing outright on a non-fast-forward push.
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "git push failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Push rejected, pulling --rebase and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done
