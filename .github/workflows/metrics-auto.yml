name: Metrics auto file (weekly)

# N11 (Addendum N, ROADMAP step 158). Reads `metrics_daily` and writes docs/metrics/state_METRICS_auto_YYYY-MM-DD.md (counts only, with as-of
# dates and sample sizes) for the Hub to copy into the project's state_METRICS.md (item 125). Read-only against D1. Monday, after the 09:00 UTC
# weekly standup and the 09:30 UTC daily metrics job. A manual run is a dry run unless dry_run is set to false.

on:
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = write the file only into the run summary, no commit'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

concurrency:
  group: metrics-auto
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # commits the file under docs/metrics/

    steps:
      - name: Checkout the latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install wrangler
        run: npm install --prefix "$RUNNER_TEMP/wr" wrangler@4.129.0 --no-audit --no-fund --loglevel=error

      - name: Write the metrics file
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_JS: ${{ runner.temp }}/wr/node_modules/wrangler/bin/wrangler.js
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}
        shell: bash
        run: |
          flags=""
          if [ "$DRY_RUN" = "true" ]; then flags="--out-dir metrics_out"; fi
          node scripts/data/metrics-auto.mjs $flags | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Show the file in the run summary (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' }}
        shell: bash
        run: cat metrics_out/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the metrics file
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false' }}
        shell: bash
        run: |
          git config user.name "sparkfare-bot"
          git config user.email "actions@github.com"
          git add docs/metrics/
          git diff --cached --quiet || git commit -m "Metrics auto file - $(date -u +'%Y-%m-%d')"

          # Retry with rebase if another commit lands on main while this job is running.
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then
              echo "git push failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Push rejected, pulling --rebase and retrying (attempt $attempt)..."
            git pull --rebase origin main
          done
