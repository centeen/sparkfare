<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparkfare — Sign in</title>
  <meta name="description" content="Sign in to your Sparkfare account to manage your tracked flight deals and personalized preferences.">
  <meta property="og:title" content="Sparkfare — Sign in">
  <meta property="og:description" content="Sign in to your Sparkfare account to manage your tracked flight deals and personalized preferences.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sparkfare.com/sign-in">
  <link rel="icon" href="/favicon.png" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/sparkfare_mark.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/brand/tokens.css">
<link rel="stylesheet" href="/brand/fonts.css">
<style>

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--sand);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    /* Modal overlay */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(46, 35, 24, 0.55);
      z-index: 100;
      display: flex;
      justify-content: center;
      padding: 20px;
      /* The backdrop is fixed, so it must scroll itself when the card (plus the password field Clerk adds for a returning
         user) is taller than the window. The card centres with auto margins instead of vertical flex centring, which would
         push the top of an overflowing card above the screen where it can never be scrolled to. */
      overflow-y: auto;
    }

    .modal-card {
      margin: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px 28px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(46, 35, 24, 0.18);
      position: relative;
    }

    .modal-card h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    .modal-card .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.93rem;
      line-height: 1.5;
    }

    .status {
      margin-top: 14px;
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status.error { color: var(--clay); }
    .status.success { color: var(--sage); }

    #clerk-root {
      min-height: 280px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    /* Clerk sizes its own card box (350px max) and card (padding 40px) regardless of the box it is mounted in, so on a
       narrow screen or inside the 420px modal it spilled past the right edge. Make every layer fill the container and
       never exceed it. (The appearance.elements strings in the script below are passed as class names, not CSS, so
       they never sized anything; this stylesheet does.) */
    #clerk-root .cl-cardBox,
    #clerk-root .cl-card {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    @media (max-width: 480px) {
      .modal-backdrop { padding: 12px; }
      .modal-card { padding: 24px 16px 20px; }
      #clerk-root .cl-card { padding: 24px 16px; }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
  <!-- Full-page background (sand) with nothing rendered on it -->  
  <div class="modal-backdrop">
    <main class="modal-card" id="main">
      <h1>Welcome back to Sparkfare</h1>
      <p class="sub">Sign in to manage your saved origin, deal alerts, and Away Mode preferences.</p>
      <div id="clerk-root"></div>
      <div id="auth-status" class="status" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const appKey = 'pk_live_Y2xlcmsuc3BhcmtmYXJlLmNvbSQ';
    const status = document.getElementById('auth-status');

    if (!appKey || appKey.includes('placeholder')) {
      status.textContent = 'Set SPARKFARE_CLERK_PUBLISHABLE_KEY before enabling live sign-in.';
      status.className = 'status error';
    } else {
      const uiScript = document.createElement('script');
      uiScript.src = 'https://clerk.sparkfare.com/npm/@clerk/ui@1/dist/ui.browser.js';
      uiScript.crossOrigin = 'anonymous';
      uiScript.onload = () => {
        const script = document.createElement('script');
        script.src = 'https://clerk.sparkfare.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js';
        script.setAttribute('data-clerk-publishable-key', appKey);
        script.crossOrigin = 'anonymous';
        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect_to') || '/account.html';

        script.onload = async () => {
        try {
          const clerk = window.Clerk;
          await clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });

          if (clerk.user) {
            status.textContent = 'Signed in. Redirecting…';
            status.className = 'status success';
            window.location.href = redirectParam;
            return;
          }

          clerk.mountSignIn(document.getElementById('clerk-root'), {
            redirectUrl: redirectParam,
            appearance: {
              layout: {
                socialButtonsPlacement: 'top',
                socialButtonsVariant: 'blockButton'
              },
              elements: {
                rootBox: 'width: 100%;',
                card: 'background: var(--card); border: 1px solid var(--line); border-radius: 8px;'
              }
            }
          });
        } catch (error) {
          console.error('Clerk initialization failed:', error);
          status.textContent = `Clerk initialization failed: ${error.message || error}`;
          status.className = 'status error';
        }
        };
        document.body.appendChild(script);
      };
      uiScript.onerror = () => {
        status.textContent = 'Clerk UI components failed to load.';
        status.className = 'status error';
      };
      document.body.appendChild(uiScript);
    }
  </script>
</body>
</html>
