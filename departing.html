<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taking you to your fare | Sparkfare</title>
  <style>
    :root { --sand: #E8DCC5; --card: #FAF6EE; --border: #D9CBB0; --text: #2E2318; --muted: #6B5A45; --amber: #B8720F; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--sand); color: var(--text); font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
    main { width: min(100%, 520px); padding: 32px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 1.8rem; }
    p { margin: 0; color: var(--muted); }
    .teaser { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); font-size: .9rem; }
    a { color: var(--amber); }
  </style>
</head>
<body>
  <main>
    <h1>Taking you to your fare</h1>
    <p>One moment while we open the booking page.</p>
    <p class="teaser">While you are away, Sparkfare can help you handle travel coverage, home and pet care, and connectivity before departure.</p>
    <p id="fallback" hidden><a id="continue" href="">Continue to booking</a></p>
  </main>
  <script>
    const target = new URLSearchParams(window.location.search).get('url');
    const fallback = document.getElementById('fallback');
    const continueLink = document.getElementById('continue');
    if (target) {
      continueLink.href = target;
      fallback.hidden = false;
      window.setTimeout(() => { window.location.replace(target); }, 700);
    } else {
      fallback.hidden = false;
      continueLink.href = '/';
      continueLink.textContent = 'Return to Sparkfare';
    }
  </script>
</body>
</html>
