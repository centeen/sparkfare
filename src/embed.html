<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparkfare — Embed Widget Generator</title>
  <style>
    :root {
      --sand: #E8DCC5;
      --card: #FAF6EE;
      --border: #D9CBB0;
      --amber: #B8720F;
      --text: #2E2318;
      --muted: #6B5A45;
      --radius: 6px;
    }
    body {
      margin: 0; background: var(--sand); color: var(--text);
      font-family: 'Segoe UI', sans-serif; line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.03em; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    input, select, button { font: inherit; border-radius: 6px; border: 1px solid var(--border); padding: 10px 12px; }
    button { background: var(--amber); border-color: var(--amber); color: white; cursor: pointer; font-weight: 600; }
    code { display: block; padding: 16px; background: #fff; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 24px; white-space: pre-wrap; word-break: break-all; }
    .preview { border: 1px dashed var(--border); padding: 16px; background: #fff; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Get your embed code</h1>
      <p class="sub">Generate a live flight deal sparkline for your readers.</p>
      
      <div class="field">
        <label for="origin">Origin Airport</label>
        <select id="origin">
          <option value="JFK">JFK - New York</option>
          <option value="LAX">LAX - Los Angeles</option>
          <option value="ORD">ORD - Chicago</option>
          <option value="ATL">ATL - Atlanta</option>
          <option value="DFW">DFW - Dallas</option>
          <option value="SFO">SFO - San Francisco</option>
          <option value="MIA">MIA - Miami</option>
          <option value="IAD">IAD - Washington DC</option>
          <option value="EWR">EWR - Newark</option>
          <option value="SEA">SEA - Seattle</option>
          <option value="IAH">IAH - Houston</option>
          <option value="BOS">BOS - Boston</option>
        </select>
      </div>

      <div class="field">
        <label for="dest">Destination City (e.g. Paris, France)</label>
        <input type="text" id="dest" value="Paris, France" />
      </div>

      <button id="generate" type="button">Generate Snippet</button>

      <div style="margin-top: 32px;">
        <label>Your Embed Code</label>
        <code id="snippet">&lt;!-- Click Generate to see your snippet --&gt;</code>
      </div>

      <div>
        <label>Live Preview</label>
        <div class="preview" id="preview-container">
          <!-- iframe injected here -->
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('generate').addEventListener('click', () => {
      const origin = document.getElementById('origin').value;
      const dest = encodeURIComponent(document.getElementById('dest').value.trim() || 'Paris, France');
      const originUrl = window.location.origin;
      const widgetUrl = `${originUrl}/widget?origin=${origin}&destination=${dest}`;
      
      const snippet = `<iframe src="${widgetUrl}" width="100%" height="80" frameborder="0" scrolling="no"></iframe>`;
      
      document.getElementById('snippet').textContent = snippet;
      document.getElementById('preview-container').innerHTML = snippet;
    });
    // Generate default on load
    document.getElementById('generate').click();
  </script>
</body>
</html>
