<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Sparkfare</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="That page doesn't exist on Sparkfare — here's how to find real flight deals instead.">
  <link rel="icon" href="/favicon.png" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/sparkfare_mark.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --sand: #E8DCC5;
      --card: #FAF6EE;
      --border: #D9CBB0;
      --amber: #B8720F;
      --sage: #4F7A52;
      --text: #2E2318;
      --muted: #6B5A45;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--sand);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    p { color: var(--muted); }

    a { color: var(--amber); }

    .site-nav {
      display: flex;
      gap: 18px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .site-nav a {
      color: var(--muted);
      text-decoration: none;
    }

    .site-nav a:hover { text-decoration: underline; }

    .site-nav a.brand-link { display: inline-flex; align-items: center; gap: 6px; }
    .brand-mark { width: 16px; height: 16px; flex-shrink: 0; }

    .fare-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      display: block;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .actions a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .actions a.primary {
      background: var(--sage);
      color: #fff;
    }

    .actions a.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a href="/" class="brand-link">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
          <path d="M8,8 L8,36 L30,36 L27,29 L30,22 L27,15 L30,8 Z" fill="none" stroke="#2B2620" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="18" cy="22" r="3.5" fill="#E8B930"/>
        </svg>
        Sparkfare
      </a>
      <a href="/away-mode">Away Mode</a>
      <a href="/blog/">Blog</a>
      <a href="/data/">All Routes</a>
      <a href="/watchlists">Watchlists</a>
      <a href="/hub">Referrals</a>
      <a href="/trips">Trips</a>
      <a href="/account">Preferences</a>
      <a href="/privacy">Privacy</a>
      <a class="sign-in-link" href="/sign-in">Sign in</a>
    </nav>
    <div class="card">
      <svg class="fare-mark" viewBox="0 0 44 44" aria-hidden="true">
        <path d="M8,8 L8,36 L30,36 L27,29 L30,22 L27,15 L30,8 Z" fill="none" stroke="#2B2620" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="18" cy="22" r="3.5" fill="#E8B930"/>
      </svg>
      <h1>This fare doesn't exist</h1>
      <p>The page you're looking for isn't here — it may have moved, or the link was typed wrong. Today's real deals are still on the board.</p>
      <div class="actions">
        <a class="primary" href="/">See today's deals</a>
        <a class="secondary" href="/data/">Browse all routes</a>
      </div>
    </div>
  </div>
</body>
</html>
