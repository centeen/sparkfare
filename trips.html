<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sparkfare — My Trips</title>
  <meta name="description" content="Track and manage the flight deals you've clicked on. Review historical fare targets and booked trips.">
  <meta property="og:title" content="Sparkfare — My Trips">
  <meta property="og:description" content="Track and manage the flight deals you've clicked on. Review historical fare targets and booked trips.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sparkfare.com/trips">
  <link rel="icon" href="/favicon.png" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/sparkfare_mark.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --sand: #E8DCC5;
      --card: #FAF6EE;
      --border: #D9CBB0;
      --amber: #B8720F;
      --sage: #4F7A52;
      --text: #2E2318;
      --muted: #6B5A45;
      --muted-dim: #605142;
      --radius: 6px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--sand);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.5;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 24px;
    }

    .status {
      min-height: 1.4em;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--muted-dim);
    }

    .status.error { color: #7a2a1a; }

    .trip-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .trip-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .trip-dest {
      font-weight: 600;
      margin: 0 0 4px;
    }

    .trip-meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0;
    }

    .badge {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.clicked {
      background: #F3EBDA;
      color: var(--muted-dim);
    }

    .badge.booked {
      background: var(--sage);
      color: #fff;
    }

    .btn-share {
      background: var(--amber);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .btn-share:hover {
      opacity: 0.9;
    }

    .empty-note {
      color: var(--muted-dim);
      font-size: 0.95rem;
      padding: 20px 0;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--sage);
      font-size: 0.9rem;
    }

    .site-nav {
      display: flex;
      gap: 18px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .site-nav a {
      color: var(--muted-dim);
      text-decoration: none;
    }

    .site-nav a:hover { text-decoration: underline; }

    .site-nav a.brand-link { display: inline-flex; align-items: center; gap: 6px; }
    .brand-mark { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a href="/" class="brand-link">
        <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
          <path d="M8,8 L8,36 L30,36 L27,29 L30,22 L27,15 L30,8 Z" fill="none" stroke="#2B2620" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="18" cy="22" r="3.5" fill="#E8B930"/>
        </svg>
        Sparkfare
      </a>
      <a href="/away-mode">Away Mode</a>
      <a href="/blog/">Blog</a>
      <a href="/watchlists">Watchlists</a>
      <a href="/account">Preferences</a>
      <a href="/privacy">Privacy</a>
    </nav>
    <div class="card">
      <h1>My Trips</h1>
      <p class="sub">Every fare you've clicked through to book, tracked here.</p>

      <div id="trips-status" class="status" aria-live="polite">Loading your trips…</div>
      <div id="trip-list" class="trip-list"></div>

      <a class="back-link" href="/account">Back to your account</a>
    </div>
  </div>

  <script>
    const appKey = 'pk_live_Y2xlcmsuc3BhcmtmYXJlLmNvbSQ';
    const statusEl = document.getElementById('trips-status');
    const listEl = document.getElementById('trip-list');
    let clerk;

    function showError(error) {
      console.error('My Trips failed to load:', error);
      statusEl.textContent = error.message || 'Your trips could not be loaded.';
      statusEl.className = 'status error';
    }

    function fmtPrice(n) {
      return typeof n === 'number' ? '$' + n.toLocaleString('en-US') : 'N/A';
    }

    function fmtDate(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      return isNaN(d) ? null : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderTrips(trips) {
      if (!trips.length) {
        listEl.innerHTML = '<p class="empty-note">No tracked trips yet — click "Book this fare" on a deal from the home page to start tracking one.</p>';
        return;
      }

      listEl.innerHTML = trips.map((trip) => {
        const departure = fmtDate(trip.departure_at);
        const clicked = fmtDate(trip.clicked_at);
        const statusLabel = trip.status === 'booked' ? 'Booked' : 'Clicked';
        return `
          <div class="trip-row">
            <div>
              <p class="trip-dest">${trip.destination}</p>
              <p class="trip-meta">
                From ${trip.origin_iata}${departure ? ` · Departs ${departure}` : ''} · ${fmtPrice(trip.price_at_click)}${clicked ? ` · Tracked ${clicked}` : ''}
              </p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
              <span class="badge ${trip.status === 'booked' ? 'booked' : 'clicked'}">${statusLabel}</span>
              <label style="font-size: 0.8rem; display: flex; align-items: center; gap: 4px;">
                <input type="checkbox" onchange="toggleOpen('${trip.trip_id}', this.checked)" ${trip.is_open ? 'checked' : ''}> Open
              </label>
              <button onclick="shareTrip('${trip.trip_id}')" class="btn-share">Share</button>
            </div>
          </div>`;
      }).join('');
    }

    function shareTrip(tripId) {
      const shareUrl = window.location.origin + '/share/' + tripId;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert('Share link copied to clipboard! Paste it in iMessage or WhatsApp to show the trip card.');
      }).catch(err => {
        alert('Failed to copy: ' + shareUrl);
      });
    }

    async function toggleOpen(tripId, isOpen) {
      try {
        const token = await clerk.session?.getToken();
        if (!token) throw new Error('Not authenticated');
        const res = await fetch('/api/trips/' + tripId + '/open', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ is_open: isOpen })
        });
        if (!res.ok) throw new Error('Failed to update');
      } catch (err) {
        alert('Failed to update open status: ' + err.message);
      }
    }

    async function loadTrips() {
      try {
        const token = await clerk.session?.getToken();
        if (!token) throw new Error('Your session has expired. Please sign in again.');

        const response = await fetch('/api/trips', {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        const result = await response.json().catch(() => ({ ok: false, error: 'Request failed' }));
        if (!response.ok || !result.ok) throw new Error(result.error || 'Trips could not be loaded');

        statusEl.textContent = '';
        renderTrips(result.trips || []);
      } catch (error) {
        showError(error);
      }
    }

    async function initialize() {
      const uiScript = document.createElement('script');
      uiScript.src = 'https://clerk.sparkfare.com/npm/@clerk/ui@1/dist/ui.browser.js';
      uiScript.crossOrigin = 'anonymous';
      uiScript.onload = () => {
        const script = document.createElement('script');
        script.src = 'https://clerk.sparkfare.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js';
        script.setAttribute('data-clerk-publishable-key', appKey);
        script.crossOrigin = 'anonymous';
        script.onload = async () => {
          try {
            clerk = window.Clerk;
            await clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
            if (!clerk.session) {
              window.location.href = '/sign-in';
              return;
            }
            await loadTrips();
          } catch (error) {
            showError(error);
          }
        };
        script.onerror = () => showError(new Error('Clerk failed to load.'));
        document.body.appendChild(script);
      };
      uiScript.onerror = () => showError(new Error('Clerk UI failed to load.'));
      document.body.appendChild(uiScript);
    }

    initialize();
  </script>
</body>
</html>
